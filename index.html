<script>
{
const C = window.JALEO || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => Number(n).toFixed(2).replace('.', ',').replace(',00', '') + ' €';
const hm = t => new Date(t).toLocaleTimeString('ca-ES', { hour: '2-digit', minute: '2-digit' });
const DAY = 864e5;
const store = { get(k){ try { return localStorage.getItem(k); } catch(_) { return null; } }, set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(_) {} } };
const ok = !!(C.supabaseUrl && C.supabaseAnonKey && window.supabase);
const sb = ok ? window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey) : null;

/* ---------- Notificacions al mòbil (Web Push) ---------- */
const PUSH_KEY = 'BNk9TOPVzUDUEyPQpm7fDH-BH6uGcPg4qKwyt3yohxhLnT6piXinxaWxSY2Hb3nuvGmisXxYUOl3W1Gn8zo72ZU';
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
function b64u(x){ const r = atob((x + '='.repeat((4 - x.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); }
async function pushState(){
  if (!pushSupported()) return isIOS && !isStandalone() ? 'ios' : 'no';
  if (Notification.permission === 'denied') return 'denied';
  try { const reg = await navigator.serviceWorker.getRegistration('/'); const sub = reg && await reg.pushManager.getSubscription(); return sub ? 'on' : 'off'; } catch(_) { return 'off'; }
}
async function pushOn(secret){
  if ((await Notification.requestPermission()) !== 'granted') throw new Error('perm');
  const reg = await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(PUSH_KEY) });
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_secret: secret || null });
  if (error) throw error;
}
async function pushOff(){
  const reg = await navigator.serviceWorker.getRegistration('/'); const sub = reg && await reg.pushManager.getSubscription();
  if (sub) { await sb.rpc('drop_push', { p_endpoint: sub.endpoint }); await sub.unsubscribe(); }
}
const STAR = (s, c) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 2l6 24 24 6-24 6-6 24-6-24-24-6 24-6z" fill="${c}"/></svg>`;
let tt; const toast = t => { $('#fx').insertAdjacentHTML('beforeend', `<div class="toast" role="status"><div class="ic">J</div><div><b>${esc(C.nom)}</b><div style="font-size:14px">${esc(t)}</div></div></div>`); clearTimeout(tt); tt = setTimeout(() => document.querySelectorAll('.toast').forEach(x => x.remove()), 4500); };
const confetti = () => { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; const cols = ['#A3202F', '#D0394A', '#C9A55A', '#F2D9B0', '#7A1424']; let h = '<div class="confetti">'; for (let i = 0; i < 70; i++) h += `<i style="left:${Math.random() * 100}%;background:${cols[i % 5]};animation-duration:${2 + Math.random() * 2.5}s;animation-delay:${Math.random() * .6}s;transform:rotate(${Math.random() * 360}deg)"></i>`; $('#fx').insertAdjacentHTML('beforeend', h + '</div>'); setTimeout(() => document.querySelectorAll('.confetti').forEach(x => x.remove()), 5500); };
const ERR = { BAD_OPTION: 'Alguna beguda no té la mescla triada. Torna-la a afegir.', OFFER_CLOSED: 'Aquesta oferta encara no està oberta.', ALREADY_CLAIMED: 'Ja l’has demanada avui.', JCC_ONLY: 'Només per a membres de la comunitat JCC.', BAD_JCC: 'Aquest enllaç JCC ja no és vàlid. Agafa el nou a la comunitat de WhatsApp.', NO_CARD: 'Primer fes-te la targeta.', EMAIL_EXISTS: 'Aquest email ja té una targeta amb un altre nom. Escriu el nom tal com el vas posar el primer cop, o demana a la barra que te la recuperin.', BAD_EMAIL: 'Revisa l’email.', BAD_NAME: 'Escriu el teu nom.', ADULT_REQUIRED: 'Has de ser major de 18 anys.', TOO_MANY: 'Massa peticions seguides. Espera uns minuts.', NOT_ENOUGH: 'Encara no tens prou punts.', ALREADY_PENDING: 'Ja tens un premi demanat. Espera que te’l portin.', TABLE_TAKEN: 'Aquesta taula ja està reservada aquest dia.', BAD_DAY: 'Tria un dia d’avui als propers 60 dies.', BAD_ITEM: 'Algun producte ja no està disponible.', NO_CARD: 'No trobem la teva targeta.' };
const errMsg = e => { const m = (e && (e.message || e.details)) || ''; const k = Object.keys(ERR).find(k => m.includes(k)); return k ? ERR[k] : 'Hi ha hagut un error. Torna-ho a provar.'; };

function pic(kind, col){
  const id = 'g' + Math.random().toString(36).slice(2, 7), s = 'fill="none" stroke="#F7F0E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
  const sh = { glass:`<path d="M64 20h32l-4 58H68z" ${s}/><path d="M68 40h24" ${s}/><rect x="72" y="44" width="9" height="9" rx="2" fill="#F7F0E6" opacity=".6"/><path d="M86 34l12-22" ${s}/>`, cocktail:`<path d="M58 22h44L80 48z" ${s}/><path d="M80 48v26M68 76h24" ${s}/><circle cx="96" cy="22" r="7" ${s}/>`, beer:`<path d="M64 26h28v50H64z" ${s}/><path d="M92 36h8a6 6 0 016 6v14a6 6 0 01-6 6h-8" ${s}/><path d="M62 26q6-10 16-4q8-8 16 4" ${s}/>`, bucket:`<path d="M54 36h52l-6 42H60z" ${s}/><path d="M64 36V18M76 36V14M88 36V18M98 36V20" ${s}/>`, shot:`<path d="M68 30h24l-3 40H71z" ${s}/><path d="M70 42h20" ${s}/>`, hookah:`<path d="M72 14h16l-3 10h-10z" ${s}/><path d="M80 24v24M66 32h28" ${s}/><path d="M80 48c-16 4-18 24 0 28c18-4 16-24 0-28z" ${s}/><path d="M86 40c18 0 22 18 14 30" ${s}/>`, soda:`<path d="M70 18h20v58H70z" ${s}/><path d="M70 34h20" ${s}/>`, food:`<path d="M52 56h56a28 18 0 01-56 0z" ${s}/><path d="M66 46q4-10 0-18M80 46q4-10 0-18M94 46q4-10 0-18" ${s}/>` };
  return `<svg viewBox="0 0 160 92" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${esc(col)}"/><stop offset="1" stop-color="#7A1424"/></linearGradient></defs><rect width="160" height="92" fill="url(#${id})"/><circle cx="130" cy="16" r="26" fill="#fff" opacity=".08"/><g class="dr">${sh[kind] || sh.glass}</g></svg>`;
}

/* =====================================================================
   1 · WEB + APP DEL CLIENT
   ===================================================================== */
function startApp(){
  const params = new URLSearchParams(location.search);
  if (params.get('mesa')) { try { sessionStorage.setItem('jaleo_mesa', params.get('mesa').slice(0, 10)); } catch(_) {} }
  if (params.get('ref')) store.set('jaleo_ref', params.get('ref').slice(0, 12));
  if (params.get('card')) store.set('jaleo_secret', params.get('card').slice(0, 80));
  if (params.get('jcc')) store.set('jaleo_jcc', params.get('jcc').slice(0, 20));
  if ([...params.keys()].length) history.replaceState(null, '', location.pathname + location.hash);
  let mesa = null; try { mesa = sessionStorage.getItem('jaleo_mesa'); } catch(_) {}
  const S = { push: null, mo: null, screen: params.get('v') === 'avisos' ? 'avisos' : params.get('v') === 'ofertes' ? 'ofertes' : !store.get('jaleo_secret') ? 'registre' : mesa ? 'carta' : 'web', menu: [], rewards: [], offers: [], notices: [], tables: [], card: null, secret: store.get('jaleo_secret'), cart: {}, msg: '', err: '', taken: [], resDay: null, resTable: null, resForm: { h: '22:00', p: 4, n: '' }, busy: false, cat: null,
    lastOrder: JSON.parse(store.get('jaleo_last_order') || 'null'), order: null, bumped: null };

  async function loadPublic(){
    if (!ok) { // vista prèvia amb dades d'exemple fins que connectis la base de dades
      const M = [['Copes','Cubata',7,'glass','#7A3412'],['Copes','Mojito',7,'cocktail','#4f8a3c'],['Copes','Piña colada',7.5,'cocktail','#c9a55a'],['Copes','Cubata premium',10,'glass','#5a2208'],['Cervesa','Canya',2.3,'beer','#d49a2a'],['Cervesa','Galleda 6 quintos',10,'bucket','#b8954e'],['Cachimbes','Cachimba',12,'hookah','#7A1424'],['Cachimbes','Cachimba premium',18,'hookah','#C9A55A'],['Sense alcohol','Refresc',2.5,'soda','#3e6db5']];
      const IMG = { 'Cubata': 'cubata', 'Mojito': 'mojito', 'Piña colada': 'pina-colada', 'Cubata premium': 'cubata-premium', 'Canya': 'canya', 'Galleda 6 quintos': 'galleda-6-quintos', 'Cachimba': 'cachimba', 'Cachimba premium': 'cachimba-premium', 'Refresc': 'refresc' };
      S.menu = M.map((m, i) => ({ id: i + 1, category: m[0], name: m[1], price: m[2], icon: m[3], color: m[4], image: IMG[m[1]] ? 'img/productes/' + IMG[m[1]] + '.svg' : null }));
      S.rewards = [{ id: 1, name: 'Refresc o xupito', cost: 30 }, { id: 2, name: 'Cubata de regal', cost: 60 }, { id: 3, name: 'Cachimba sense nicotina de regal', cost: 120 }];
      S.offers = [{ id: 1, title: 'Doble punts els dijous', body: 'Jaleo Universitari · membres JCC' }];
      return;
    }
    const [m, r, o, n, t] = await Promise.all([sb.from('menu_items').select('*').order('sort').order('id'), sb.from('rewards').select('*').order('cost'), sb.from('offers').select('*').order('id'), sb.from('notices').select('*').order('created_at', { ascending: false }).limit(10), sb.from('dining_tables').select('*').order('id')]);
    S.menu = m.data || []; S.rewards = r.data || []; S.offers = o.data || []; S.notices = n.data || []; S.tables = t.data || [];
  }
  async function loadCard(){
    if (!ok || !S.secret) { S.card = null; return; }
    const { data, error } = await sb.rpc('get_card', { p_secret: S.secret });
    if (error) return;
    if (!data) { store.set('jaleo_secret', null); S.secret = null; S.card = null; return; }
    S.card = data; if (data.name) store.set('jaleo_name', data.name); if (data.email) store.set('jaleo_email', data.email);
    await joinJcc();
  }
  async function joinJcc(){
    const code = store.get('jaleo_jcc'); if (!code || !S.card || !S.secret) return;
    const { error } = await sb.rpc('join_jcc', { p_secret: S.secret, p_code: code });
    store.set('jaleo_jcc', null);
    if (error) { toast(errMsg(error)); return; }
    if (!S.card.jcc) { S.card.jcc = true; toast('Ja ets JCC! Els dijous sumes punts x2 ⭐'); }
  }
  async function loadMO(){
    if (!ok || !S.secret) { S.mo = null; return; }
    const { data } = await sb.rpc('my_offers', { p_secret: S.secret }); S.mo = data || null;
  }
  const kid = k => Number(String(k).split('~')[0]);
  const kopt = k => String(k).split('~').slice(1).filter(Boolean);
  const price = k => (S.menu.find(x => x.id == kid(k)) || {}).price || 0;
  const hasOpts = i => !!(i && i.options && (i.options.choices || []).length);
  const inCart = id => Object.entries(S.cart).reduce((a, [k, q]) => a + (kid(k) === Number(id) ? q : 0), 0);
  const cartN = () => Object.values(S.cart).reduce((a, b) => a + b, 0);
  const cartT = () => Object.entries(S.cart).reduce((a, [k, q]) => a + price(k) * q, 0);
  const go = s => { S.screen = s; S.err = ''; S.msg = ''; render(); window.scrollTo({ top: 0 }); };
  const head = r => `<div class="brand"><a href="#" data-a="go" data-v="web">${esc(C.nom)}</a><span>${r}</span></div>`;

/* =====================================================================
   2 · PANELL DE LA BARRA  (adreça de la web + #panel)
   ===================================================================== */
function startPanel(){
  document.title = C.nom + ' · Panell';
  if (!ok) { $('#root').innerHTML = '<div class="pw"><h1 style="color:var(--acc)">Falta la configuració</h1><p>Omple la part de CONFIGURACIÓ del codi (guia, pas 3).</p></div>'; return; }
  const S = { tab: 'comandes', orders: [], reqs: [], res: [], customers: [], tables: [], menu: [], rewards: [], offers: [], notices: [], q: '', filter: 'tots', selTable: null, dirty: new Set(), msg: '', seen: new Set(), recovery: null, loaded: false };
  const status = c => { if (!c.last_visit) return ['Nou', 'c-grey']; const d = (Date.now() - new Date(c.last_visit)) / DAY; return d < 14 ? ['Actiu', 'c-ok'] : d <= 30 ? ['En risc', 'c-wait'] : ['Inactiu', 'c-no']; };
  const ago = t => { if (!t) return '—'; const d = Math.floor((Date.now() - new Date(t)) / DAY); return d < 1 ? 'avui' : d === 1 ? 'ahir' : 'fa ' + d + ' dies'; };
  const cname = id => (S.customers.find(c => c.id === id) || {}).name || '';
  const tname = id => (S.tables.find(t => t.id === id) || {}).name || '';
  let ctx; const beep = () => { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); [0, .18].forEach(d => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = d ? 1175 : 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.25, ctx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + d + .35); o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + .35); }); } catch(_) {} };

  async function load(){
    const since = new Date(Date.now() - 2 * DAY).toISOString();
    const [o, q, r, c, t, m, w, of, n] = await Promise.all([sb.from('orders').select('*').gte('created_at', since).order('created_at', { ascending: false }), sb.from('reward_requests').select('*').gte('created_at', since).order('created_at', { ascending: false }), sb.from('reservations').select('*').gte('day', new Date().toISOString().slice(0, 10)).order('day').order('time'), sb.from('customers').select('id,code,name,email,marketing,points,visits,spent,last_visit,referred_by,created_at,jcc').order('created_at', { ascending: false }), sb.from('dining_tables').select('*').order('id'), sb.from('menu_items').select('*').order('sort').order('id'), sb.from('rewards').select('*').order('cost'), sb.from('offers').select('*').order('id'), sb.from('notices').select('*').order('created_at', { ascending: false }).limit(20)]);
    const nw = (o.data || []).filter(x => x.status === 'rebuda' && !S.seen.has('o' + x.id)).length + (q.data || []).filter(x => x.status === 'pendent' && !S.seen.has('q' + x.id)).length;
    if (S.loaded && nw) beep();
    (o.data || []).forEach(x => S.seen.add('o' + x.id)); (q.data || []).forEach(x => S.seen.add('q' + x.id));
    S.orders = o.data || []; S.reqs = q.data || []; S.res = r.data || []; S.customers = c.data || []; if (!S.dirty.size) S.tables = t.data || [];
    S.menu = m.data || []; S.rewards = w.data || []; S.offers = of.data || []; S.notices = n.data || []; S.loaded = true;
    const pc = await sb.from('push_subs').select('id', { count: 'exact', head: true }); S.pushN = pc.count || 0;
    const oc = await sb.from('offer_claims').select('*').gte('created_at', since).order('created_at', { ascending: false }); S.claims = oc.data || [];
    if (!S.jcc) { const jc = await sb.rpc('jcc_code'); S.jcc = jc.data || ''; }

  function render(){

  function bindDrag(){

      el.setPointerCapture(ev.pointerId);
      const mv = e2 => { const dx = (e2.clientX - sx) / r.width * 100, dy = (e2.clientY - sy) / r.height * 100; if (Math.abs(dx) + Math.abs(dy) > .5) moved = true; t.x = Math.round(Math.max(0, Math.min(100 - t.w, ox + dx)) * 10) / 10; t.y = Math.round(Math.max(0, Math.min(100 - t.h, oy + dy)) * 10) / 10; el.style.left = t.x + '%'; el.style.top = t.y + '%'; };

    if (a === 'pay') { const { data, error } = await sb.rpc('pay_order', { p_id: Number(id) }); if (error) return flash('Error: ' + error.message); S.msg = data ? `Cobrada. +${data} punts sumats.` : 'Comanda cobrada.'; await load(); render(); }
    if (a === 'give' || a === 'deny') { const { data, error } = await sb.rpc('resolve_reward', { p_id: Number(id), p_accept: a === 'give' }); if (error) return flash('Error: ' + error.message); S.msg = 'Premi: ' + data; await load(); render(); }
    if (a === 'rst') await run(sb.from('reservations').update({ status: v }).eq('id', id), 'Reserva ' + v);
    if (a === 'cf') { S.filter = v; render(); }
    if (a === 'addpts') { const code = $('#apCode').value, amt = Number($('#apAmt').value); const { data, error } = await sb.rpc('add_points', { p_code: code, p_amount: amt }); if (error) return flash(error.message.includes('NO_CARD') ? 'No existeix cap targeta amb aquest codi.' : 'Error: ' + error.message); S.msg = `+${data} punts sumats a ${code.toUpperCase()}`; await load(); render(); }
    if (a === 'rec') { const { data, error } = await sb.from('customers').select('name,secret').eq('id', id).single(); if (error) return flash('Error: ' + error.message); S.recovery = { name: data.name, link: location.origin + location.pathname + '?card=' + data.secret }; render(); }
    if (a === 'closerec') { S.recovery = null; render(); }
    if (a === 'savemap') { for (const t of S.tables.filter(t => S.dirty.has(t.id))) { const { error } = await sb.from('dining_tables').update({ name: t.name, seats: t.seats, shape: t.shape, x: t.x, y: t.y, w: t.w, h: t.h, bookable: t.bookable }).eq('id', t.id); if (error) return flash('Error: ' + error.message); } S.dirty.clear(); S.msg = 'Plànol desat.'; await load(); render(); }
    if (a === 'newtable') { const n = S.tables.filter(t => t.shape !== 'bar').length + 1; const { data, error } = await sb.from('dining_tables').insert({ name: 'Taula ' + n, seats: 4, shape: 'round', x: 45, y: 40, w: 10, h: 14 }).select().single(); if (error) return flash('Error: ' + error.message); S.tables.push(data); S.selTable = data.id; render(); }
    if (a === 'deltable') { const t = S.selTable; const { error } = await sb.from('dining_tables').delete().eq('id', t); if (error) return flash('No es pot esborrar: té reserves. Desmarca «Es pot reservar».'); S.selTable = null; S.dirty.delete(t); await load(); render(); }
    if (a === 'additem') { const r = { name: $('#nn').value.trim(), category: $('#nc').value.trim() || 'Altres', price: Number($('#np').value), icon: $('#ni').value, sort: 100 }; if (!r.name || !(r.price >= 0)) return flash('Posa nom i preu.'); await run(sb.from('menu_items').insert(r), 'Producte afegit'); }
    if (a === 'addrw') { const r = { name: $('#rwn').value.trim(), cost: Number($('#rwc').value) }; if (!r.name || !(r.cost > 0)) return flash('Posa nom i punts.'); await run(sb.from('rewards').insert(r), 'Premi afegit'); }
    if (a === 'addof') { const r = { title: $('#ofn').value.trim(), body: $('#ofb').value.trim(), perk: $('#ofp').value.trim() }; if (!r.title) return flash('Posa un títol.'); await run(sb.from('offers').insert(r), 'Oferta afegida'); }
    if (a === 'addnotice') {
      const push = !!($('#npush') && $('#npush').checked), r = { title: $('#nt').value.trim(), body: $('#nb').value.trim(), push };
      if (!r.title || !r.body) return flash('Omple títol i text.');
      b.disabled = true;
      const { data, error } = await sb.from('notices').insert(r).select('id').single(); if (error) { b.disabled = false; return flash('Error: ' + error.message); }
      S.msg = push ? 'Avís publicat. Enviant la notificació…' : 'Avís publicat'; await load(); render();
      if (push) { // el servidor envia la notificació sol; aquí només mirem el resultat
        for (let i = 0; i < 8; i++) { await new Promise(res => setTimeout(res, 1500)); const q = await sb.from('notices').select('push_result').eq('id', data.id).single(); const pr = q.data && q.data.push_result; if (pr) { S.msg = pr.error ? 'Avís publicat, però la notificació ha fallat.' : `Avís publicat i enviat a ${pr.sent} mòbil${pr.sent === 1 ? '' : 's'}.`; render(); break; } }
      }
    }
    if (a === 'ocl') await run(sb.from('offer_claims').update({ status: v }).eq('id', id), v === 'entregat' ? 'Marcat com a portat' : 'Marcat com a no disponible');
    if (a === 'delof') { if (!confirm('Esborrar aquesta oferta?')) return; await run(sb.from('offers').delete().eq('id', id), 'Oferta esborrada'); }
    if (a === 'jcccopy') { try { await navigator.clipboard.writeText($('#jccl').value); flash('Enllaç copiat'); } catch(_) { $('#jccl').select(); flash('Copia l’enllaç seleccionat'); } }
    if (a === 'jccnew') { const { data, error } = await sb.rpc('new_jcc_code'); if (error) return flash('Error: ' + error.message); S.jcc = data; flash('Codi nou. Recorda canviar l’enllaç a la comunitat.'); }
    if (a === 'delnotice') await run(sb.from('notices').delete().eq('id', id), 'Avís esborrat');
  });
  document.addEventListener('input', e => { if (e.target.id === 'cq') { S.q = e.target.value; render(); } });
  document.addEventListener('change', async e => {
    const el = e.target;
    if (el.dataset.up && el.files && el.files[0]) {
      const id = el.dataset.up; S.uploading = id; render();
      try {
        const blob = await shrink(el.files[0]);
        const path = 'producte-' + id + '-' + Date.now() + '.jpg';
        const up = await sb.storage.from('productes').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
        if (up.error) throw up.error;
        const url = sb.storage.from('productes').getPublicUrl(path).data.publicUrl;
        const { error } = await sb.from('menu_items').update({ image: url }).eq('id', id);
        if (error) throw error;
        S.uploading = null; await load(); flash('Foto actualitzada');
      } catch (err) { S.uploading = null; flash('No s’ha pogut pujar la foto: ' + (err.message || err)); }
      return;
    }
    if (el.dataset.opt) {
      const id = el.dataset.opt, it = S.menu.find(x => x.id == id) || {}, lines = el.value.split('\n').map(l => l.trim()).filter(Boolean);
      const choices = lines.map(l => { const [n, m] = l.split(':'); const mix = (m || '').split(',').map(x => x.trim()).filter(Boolean); return mix.length ? { name: n.trim(), mix } : { name: n.trim() }; }).filter(c => c.name);
      const anyMix = choices.some(c => c.mix), old = it.options || {};
      const options = choices.length ? { label: old.label || (anyMix ? 'Tria l’alcohol' : 'Tria’n un'), ...(anyMix ? { mixLabel: old.mixLabel || 'Amb què el vols?' } : {}), choices } : null;
      const { error } = await sb.from('menu_items').update({ options }).eq('id', id); flash(error ? 'Error: ' + error.message : 'Opcions desades'); await load(); return;
    }
    if (el.dataset.ofday) { const id = el.dataset.ofday, days = [...document.querySelectorAll(`[data-ofday="${id}"]:checked`)].map(x => Number(x.value)).sort(); const { error } = await sb.from('offers').update({ days }).eq('id', id); flash(error ? 'Error: ' + error.message : 'Desat'); await load(); return; }
    if (el.dataset.t) { const val = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value; const { error } = await sb.from(el.dataset.t).update({ [el.dataset.k]: val }).eq('id', el.dataset.id); flash(error ? 'Error: ' + error.message : 'Desat'); await load(); return; }
    if (S.tab === 'planol' && el.dataset.k && S.selTable) { const t = S.tables.find(x => x.id === S.selTable), k = el.dataset.k; t[k] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value; if (k === 'shape' && el.value === 'bar') t.bookable = false; S.dirty.add(t.id); render(); }
  });
  function vLogin(err){ $('#root').innerHTML = `<div class="login"><h1 style="color:var(--acc);font-size:44px">${esc(C.nom)} · Panell</h1><p class="small">Només per al personal.</p><form id="login"><label class="f" for="le">Email</label><input id="le" type="email" required autocomplete="username"><label class="f" for="lp">Contrasenya</label><input id="lp" type="password" required autocomplete="current-password">${err ? `<div class="err">${esc(err)}</div>` : ''}<button class="btn pri" type="submit">Entrar</button></form></div>`; }
  document.addEventListener('submit', async e => { if (e.target.id !== 'login') return; e.preventDefault(); const { error } = await sb.auth.signInWithPassword({ email: $('#le').value, password: $('#lp').value }); if (error) return vLogin('Email o contrasenya incorrectes.'); start(); });
  let started = false;
  async function start(){ if (started) return; started = true; await load(); render(); sb.channel('panell').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, refresh).on('postgres_changes', { event: '*', schema: 'public', table: 'offer_claims' }, refresh).on('postgres_changes', { event: '*', schema: 'public', table: 'reward_requests' }, refresh).on('postgres_changes', { event: '*', schema: 'public', table: 'reservations' }, refresh).subscribe(); setInterval(refresh, 20000); }
  async function refresh(){ await load(); if (!busyTyping() && !S.dirty.size) render(); }
  sb.auth.getSession().then(({ data }) => data.session ? start() : vLogin());
}

/* =====================================================================
   3 · QR DE LES TAULES  (adreça de la web + #qr)
   ===================================================================== */
function startQR(){
  const base = location.origin + location.pathname;
  $('#root').innerHTML = `<div class="pw"><div class="noprint"><h1 style="color:var(--acc);font-size:40px">QR per a les taules</h1><p class="small">Cada QR obre la carta amb el número de taula. Imprimeix-los i posa’ls a cada taula.</p><label class="f" for="qn">Taules (separades per comes)</label><input id="qn" value="1,2,3,4,5,6,7,8,9,Barra,Terrassa"><div class="row"><button class="sbtn" id="qgo">Generar QR</button><button class="sbtn ghost" id="qpr">Imprimir</button><a class="sbtn ghost" href="#panel" style="text-decoration:none;display:inline-flex;align-items:center">Tornar al panell</a></div></div><div class="qcards" id="qcards"></div></div>`;
  const gen = () => { const box = $('#qcards'); box.innerHTML = ''; $('#qn').value.split(',').map(s => s.trim()).filter(Boolean).forEach(t => { const d = document.createElement('div'); d.className = 'qc'; d.innerHTML = `<h2>${esc(C.nom)}</h2><div class="q"></div><p><b>${esc(/^\d+$/.test(t) ? 'Taula ' + t : t)}</b></p><p class="serif" style="font-size:20px">Escaneja, demana i suma punts</p>`; box.append(d); if (window.QRCode) new QRCode(d.querySelector('.q'), { text: base + '?mesa=' + encodeURIComponent(t), width: 160, height: 160, colorDark: '#2a0a10', colorLight: '#F7F0E6' }); }); };
  $('#qgo').onclick = gen; $('#qpr').onclick = () => window.print(); gen();
}

const route = () => location.hash === '#panel' ? 'panel' : location.hash === '#qr' ? 'qr' : 'app';
const mode = route();
if (mode === 'panel') startPanel(); else if (mode === 'qr') startQR(); else startApp();
window.addEventListener('hashchange', () => { if (route() !== mode) location.reload(); });
}
</script>
</body>
